# Builds and tests Forge on every push and pull request.
# A pull request may only be merged when this is green.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Forge.slnx
      - name: Build
        run: dotnet build Forge.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Forge.slnx --no-build --configuration Release --verbosity normal
